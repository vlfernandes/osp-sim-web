<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: o app ocupa a tela toda e respeita as áreas seguras pelo CSS abaixo -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>OSP Sim</title>
  <meta name="description" content="Simulador de programas NC OSP-P (OKUMA): alarmes, percurso, máquina 3D e usinagem.">
  <meta name="theme-color" content="#1b1e24">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OSP Sim">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <!-- tela de abertura do app instalado no iPhone (gerada do logo pelo build.sh; retrato) -->
  <link rel="apple-touch-startup-image" href="icons/abertura-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/abertura-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #15171c; color: #e6e8ee;
      overflow: hidden; overscroll-behavior: none;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* áreas seguras (entalhe, Dynamic Island, barra de início, navegação do Android) */
    #moldura {
      position: fixed; inset: 0; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #caixa { position: relative; width: 100%; height: 100%; }
    #osp_canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #osp_loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      font-size: 15px; color: #9aa3b2;
    }
    #osp_loading img { width: 72px; height: 72px; }
    #osp_loading .barra { width: 160px; height: 3px; border-radius: 2px; background: #2a2f39; overflow: hidden; }
    #osp_loading .barra i { display: block; width: 40%; height: 100%; background: #5b9bff; animation: vai 1.1s ease-in-out infinite; }
    @keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    /* aviso de instalação (iPhone: Compartilhar ▸ Adicionar à Tela de Início; Android: botão Instalar) */
    #instalar {
      position: fixed; left: 12px; right: 12px;
      bottom: calc(env(safe-area-inset-bottom) + 132px);
      display: none; align-items: center; gap: 12px;
      background: #262a33; color: #e6e8ee; border: 1px solid #353b47; border-radius: 14px;
      padding: 12px 12px 12px 14px; font-size: 14px; line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 10;
    }
    #instalar img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
    #instalar .txt { flex: 1; }
    #instalar button {
      flex: none; min-width: 44px; min-height: 44px; border: 0; border-radius: 10px;
      background: #3a404c; color: #fff; font-size: 16px;
    }
    #instalar button.prim { background: #256ce8; padding: 0 14px; font-size: 15px; }
    /* aviso de versão nova (service worker) */
    #versao {
      position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px);
      display: none; align-items: center; gap: 10px; z-index: 11;
      background: #1f3d73; color: #fff; border-radius: 12px; padding: 8px 8px 8px 14px;
      font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    #versao .txt { flex: 1; }
    #versao button { min-height: 40px; min-width: 40px; border: 0; border-radius: 9px; background: #2f6fe0; color: #fff; font-size: 15px; padding: 0 12px; }
    #versao button.sec { background: transparent; }
    /* barra de teclas extras do editor, colada no teclado do sistema */
    #teclas {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
      display: none; gap: 4px; padding: 5px 6px; overflow-x: auto;
      background: #262a33; border-top: 1px solid #353b47;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #teclas.on { display: none; }
    body.teclado #teclas.on { display: flex; }
    #teclas button {
      flex: 1 0 40px; height: 40px; border: 0; border-radius: 8px;
      background: #3a404c; color: #e6e8ee; font: 600 17px ui-monospace, Menlo, monospace;
    }
    #teclas button.ativa { background: #256ce8; }
  </style>
</head>
<body>
  <div id="moldura">
    <div id="caixa">
      <canvas id="osp_canvas"></canvas>
      <div id="osp_loading">
        <img src="icons/icon-192.png" alt="">
        <div>Abrindo o OSP Sim…</div>
        <div class="barra"><i></i></div>
        <noscript>O OSP Sim precisa de JavaScript e WebAssembly.</noscript>
      </div>
    </div>
  </div>
  <div id="versao" role="status">
    <div class="txt">Nova versão disponível</div>
    <button id="versao_sim">Atualizar</button>
    <button id="versao_fechar" class="sec" aria-label="Fechar">✕</button>
  </div>
  <div id="instalar" role="dialog" aria-label="Instalar o OSP Sim">
    <img src="icons/apple-touch-icon.png" alt="">
    <div class="txt" id="instalar_txt"></div>
    <button class="prim" id="instalar_sim" hidden>Instalar</button>
    <button id="instalar_fechar" aria-label="Fechar">✕</button>
  </div>
  <!-- recursos em paralelo, IndexedDB, compartilhar, teclado, service worker e aviso de versão nova -->
  <script src="osp-web.js"></script>
  <script>
    (function () {
      const caixa = document.getElementById("instalar");
      const txt = document.getElementById("instalar_txt");
      const sim = document.getElementById("instalar_sim");
      const chave = "osp-instalar-dispensado";
      let dispensado = false;
      try { dispensado = localStorage.getItem(chave) === "1"; } catch (e) {}
      const instalado = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
      const ua = navigator.userAgent;
      const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const safari = ios && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome\//.test(ua);
      document.getElementById("instalar_fechar").onclick = () => {
        caixa.style.display = "none";
        try { localStorage.setItem(chave, "1"); } catch (e) {}
      };
      const mostrar = (html) => {
        if (instalado || dispensado) return;
        txt.innerHTML = html;
        // depois que o app abriu, para não cobrir a tela de abertura
        setTimeout(() => { caixa.style.display = "flex"; }, 2500);
      };
      // iPhone/iPad no Safari: o iOS não mostra aviso automático
      if (safari) {
        mostrar("Instale o OSP Sim: toque em <b>Compartilhar</b> ▸ <b>Adicionar à Tela de Início</b>.");
      }
      // Android/Chrome: aviso de instalação do navegador
      let pedido = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        // no iPhone/iPad vale a instrução do Safari (o evento só existe no Chromium)
        if (ios) return;
        pedido = e;
        sim.hidden = false;
        mostrar("Instale o OSP Sim para abrir pela tela inicial e usar sem internet.");
      });
      sim.onclick = async () => {
        if (!pedido) return;
        pedido.prompt();
        try { await pedido.userChoice; } catch (e) {}
        pedido = null;
        caixa.style.display = "none";
      };
      window.addEventListener("appinstalled", () => { caixa.style.display = "none"; });
    })();
  </script>
  <script type="module">
    import init from "./osp_sim.js";
    // o módulo compilado pelo osp-web.js (também vai para o Web Worker do motor)
    window.ospModuloPronto.then((m) => init({ module_or_path: m })).catch((e) => {
      const el = document.getElementById("osp_loading");
      if (el) el.innerHTML = "<p>Não foi possível carregar o OSP Sim.</p><p><small>" + e + "</small></p>";
    });
  </script>
</body>
</html>
